spring:
  application:
    name: fair-ticketing
  threads:
    virtual:
      enabled: true
  datasource:
    # rewriteBatchedStatements turns JDBC batches into real multi-row INSERTs;
    # without it MySQL still round-trips per row and seeding crawls.
    url: jdbc:mysql://localhost:3306/fair_ticketing?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&rewriteBatchedStatements=true
    username: ticketing
    password: ticketing
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

ticketing:
  # Swap between implementations to compare them under load.
  inventory:
    strategy: ${FT_INVENTORY_STRATEGY:DB_PESSIMISTIC_LOCK}
  order:
    payment-window: PT10M
    max-tickets-per-user-per-tier: 4
  waitlist:
    offer-window: PT15M
  waiting-room:
    enabled: ${FT_WAITING_ROOM_ENABLED:false}
    admit-rate-per-second: ${FT_WAITING_ROOM_RATE:20}
    burst: 50
    admission-ttl: PT5M
    max-admissions-per-poll: 200
    idle-ttl: PT12H
  payment:
    failure-rate: ${FT_PAYMENT_FAILURE_RATE:0.0}
  security:
    # Override with FT_JWT_SECRET before this is ever reachable from the internet.
    jwt-secret: ${FT_JWT_SECRET:dev-only-secret-change-me-please-32bytes-min}
    access-token-ttl: PT2H
  cors:
    allowed-origins: ${FT_CORS_ORIGINS:http://localhost:5173}
  ml:
    base-url: ${FT_ML_BASE_URL:http://localhost:8090}
    timeout: PT3S
    run-on-startup: ${FT_FORECAST_ON_START:false}
  seed:
    enabled: ${FT_SEED_ENABLED:false}
    artists: 40
    venues: 15
    past-events: 120
    upcoming-events: 12
    buyers: 4000
    random-seed: 20260814

logging:
  level:
    com.fairticketing: DEBUG
