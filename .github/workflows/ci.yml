name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # One MySQL and one Redis for the whole job. Stacking a Testcontainers
    # MySQL per @TestPropertySource OOMs the runner and leaves BuyingTicketsApiIT
    # holding a DataSource to a port that is already gone.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fair_ticketing
          MYSQL_USER: ticketing
          MYSQL_PASSWORD: ticketing
          TZ: UTC
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        working-directory: backend
        env:
          FT_IT_EXTERNAL: "true"
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, lint, test, and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test -- --coverage
          npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build application images
        run: |
          docker build -t fair-ticketing-backend:${{ github.sha }} backend
          docker build -t fair-ticketing-frontend:${{ github.sha }} frontend

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [images]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push images to GHCR
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          BACKEND=ghcr.io/${OWNER}/fair-ticketing-backend
          FRONTEND=ghcr.io/${OWNER}/fair-ticketing-frontend
          docker build -t "$BACKEND:${{ github.sha }}" -t "$BACKEND:latest" backend
          docker build -t "$FRONTEND:${{ github.sha }}" -t "$FRONTEND:latest" frontend
          docker push "$BACKEND:${{ github.sha }}"
          docker push "$BACKEND:latest"
          docker push "$FRONTEND:${{ github.sha }}"
          docker push "$FRONTEND:latest"

  ml:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and test
        working-directory: ml-service
        run: |
          python -m pip install -r requirements.txt
          pytest
