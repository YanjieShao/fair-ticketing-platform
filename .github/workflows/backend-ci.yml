name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # One MySQL and one Redis for the whole job. Stacking a Testcontainers
    # MySQL per @TestPropertySource OOMs the runner and leaves BuyingTicketsApiIT
    # holding a DataSource to a port that is already gone.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fair_ticketing
          MYSQL_USER: ticketing
          MYSQL_PASSWORD: ticketing
          TZ: UTC
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        working-directory: backend
        env:
          FT_IT_EXTERNAL: "true"
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, test, and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  ml:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and test
        working-directory: ml-service
        run: |
          python -m pip install -r requirements.txt
          pytest
