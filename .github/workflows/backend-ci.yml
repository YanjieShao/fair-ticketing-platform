name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify, not test: the concurrency tests are the point of this project and
      # they need the real database. GitHub runners already expose a Docker socket
      # where Testcontainers expects it.
      - name: Build and test
        working-directory: backend
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, test, and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
